<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>AR SMKN 1 Narmada</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    
    <style>
      #info-box {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        background: rgba(0, 51, 102, 0.9); color: white; padding: 20px;
        border-radius: 12px; display: none; z-index: 9999; text-align: center;
        font-family: sans-serif; width: 85%;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
      }
      #info-box h3 { margin-top: 0; margin-bottom: 5px; color: #ffcc00; }
      /* Style khusus untuk teks jarak */
      #ruang-jarak { font-weight: bold; color: #00ffcc; margin-bottom: 10px; display: block; font-size: 14px; }
      #ruang-info { font-size: 15px; line-height: 1.4; }
      #close-btn { margin-top: 15px; padding: 10px 20px; background: #ff3333; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 100%; }
      
      #loading-text {
        position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.7); color: white; padding: 5px 15px;
        border-radius: 20px; font-family: sans-serif; font-size: 12px; z-index: 9999;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    
    <div id="loading-text">Menunggu sinyal GPS...</div>

    <div id="info-box">
      <h3 id="ruang-nama">Nama Ruangan</h3>
      <span id="ruang-jarak">Jarak: Menghitung...</span>
      <p id="ruang-info">Informasi</p>
      <button id="close-btn" onclick="document.getElementById('info-box').style.display='none'">Tutup</button>
    </div>

    <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <!-- Kamera dengan event khusus (gps-camera-update-position) -->
      <a-camera gps-camera rotation-reader>
        <a-entity cursor="rayOrigin: mouse;" raycaster="objects: .clickable"></a-entity>
      </a-camera>
    </a-scene>

    <script>
      const apiUrl = 'https://script.google.com/macros/s/AKfycbzlLohSaDNKSYm7-lH6UXFp7uoPQ5gNWOZJiLz_RWZ4luKf06dwV_I3B5okhODXepEX/exec';

      fetch(apiUrl, { redirect: 'follow' })
        .then(response => response.json())
        .then(locations => {
          
          const scene = document.querySelector('a-scene');
          
          locations.forEach((loc) => {
            const box = document.createElement('a-box');
            box.setAttribute('gps-entity-place', `latitude: ${loc.lat}; longitude: ${loc.lng};`);
            box.setAttribute('color', '#00ff00');
            box.setAttribute('scale', '25 25 25'); 
            box.setAttribute('class', 'clickable');
            
            // Atribut kustom untuk menyimpan data jarak sementara
            box.setAttribute('data-distance', 'Menghitung...');

            const text = document.createElement('a-text');
            text.setAttribute('value', loc.nama);
            text.setAttribute('look-at', '[gps-camera]');
            text.setAttribute('align', 'center');
            text.setAttribute('position', '0 25 0'); 
            text.setAttribute('scale', '75 75 75'); 
            text.setAttribute('color', 'yellow');
            
            box.appendChild(text);

            // Menangkap event dari AR.js saat jarak berhasil dihitung
            box.addEventListener('gps-entity-place-update-positon', function(event) {
              const distance = event.detail.distance; // Nilai mentah dalam meter
              
              if(distance) {
                // Sembunyikan teks loading karena GPS sudah jalan
                document.getElementById('loading-text').style.display = 'none';
                
                let formatJarak = '';
                if (distance > 1000) {
                  formatJarak = (distance / 1000).toFixed(2) + " km";
                } else {
                  formatJarak = distance.toFixed(0) + " meter";
                }
                
                // Simpan jarak ke atribut elemen agar bisa dipanggil saat diklik
                box.setAttribute('data-distance', formatJarak);
              }
            });

            box.addEventListener('click', function () {
              document.getElementById('ruang-nama').innerText = loc.nama;
              
              // Ambil data jarak dari atribut yang terus diperbarui oleh AR.js
              const currentDistance = box.getAttribute('data-distance');
              document.getElementById('ruang-jarak').innerText = 'Berjarak sekitar ' + currentDistance + ' dari Anda';
              
              document.getElementById('ruang-info').innerText = loc.info;
              document.getElementById('info-box').style.display = 'block';
            });

            scene.appendChild(box);
          });
        })
        .catch(error => {
          console.error('Error fetching data:', error);
          alert('Gagal mengambil data! Pastikan URL API sudah benar.');
        });
    </script>
  </body>
</html>
