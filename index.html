<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>AR SMKN 1 Narmada</title>
    
    <!-- Library A-Frame dan AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    
    <style>
      /* --- HEADER BARU --- */
      #app-header {
        position: fixed; top: 0; left: 0; width: 100%; height: 55px;
        background: rgba(0, 51, 102, 0.95); color: white;
        display: flex; align-items: center; padding: 0 15px;
        box-sizing: border-box; z-index: 10000;
        box-shadow: 0px 2px 10px rgba(0,0,0,0.5);
      }
      #app-header img { height: 35px; margin-right: 12px; }
      #app-header h1 { font-size: 18px; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-weight: bold; letter-spacing: 1px; }

      /* --- FOOTER BARU --- */
      #app-footer {
        position: fixed; bottom: 0; left: 0; width: 100%; height: 25px;
        background: rgba(0, 0, 0, 0.8); color: #cccccc;
        display: flex; justify-content: center; align-items: center;
        font-family: sans-serif; font-size: 11px; z-index: 10000;
        letter-spacing: 0.5px;
      }

      #search-container { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); width: 90%; z-index: 9999; }
      #room-search { width: 100%; padding: 12px 15px; font-size: 16px; border-radius: 8px; border: 2px solid #0055aa; background: rgba(255, 255, 255, 0.95); font-weight: bold; box-shadow: 0px 4px 10px rgba(0,0,0,0.3); outline: none; }

      #hud-status {
        position: fixed; top: 125px; right: 5%; background: rgba(0,0,0,0.7);
        color: #00ff00; padding: 6px 10px; border-radius: 8px; z-index: 9999; 
        font-family: sans-serif; font-size: 11px; font-weight: bold;
      }

      #info-box {
        position: fixed; bottom: 35px; left: 50%; transform: translateX(-50%);
        background: rgba(0, 51, 102, 0.95); color: white; padding: 20px;
        border-radius: 12px; display: none; z-index: 9999; text-align: center;
        font-family: sans-serif; width: 85%; box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
      }
      #info-box h3 { margin-top: 0; color: #ffcc00; margin-bottom: 5px; }
      #ruang-jarak { font-weight: bold; color: #00ff00; margin-bottom: 15px; font-size: 1.1em; }
      
      .btn-container { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
      #route-btn { padding: 10px 15px; background: #00cc66; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; width: 60%; }
      #close-btn { padding: 10px 15px; background: #ff3333; color: white; border: none; border-radius: 5px; cursor: pointer; width: 35%; }
      
      #error-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9); color: white; display: none; 
        flex-direction: column; justify-content: center; align-items: center;
        z-index: 10001; font-family: sans-serif; text-align: center; padding: 20px;
      }
      #error-overlay h2 { color: #ff5555; }
    </style>

    <script>
      AFRAME.registerComponent('ar-garis-putus', {
        init: function () {
          this.dashes = [];
          this.numDashes = 20; 
          for (let i = 0; i < this.numDashes; i++) {
            let dash = document.createElement('a-box');
            dash.setAttribute('width', '0.4');
            dash.setAttribute('height', '0.1');
            dash.setAttribute('depth', '1.5'); 
            dash.setAttribute('color', '#00ff00');
            dash.setAttribute('opacity', '0.8');
            dash.setAttribute('visible', 'false'); 
            this.el.appendChild(dash);
            this.dashes.push(dash);
          }
        },
        tick: function () {
          if (window.activeTargetIndex && window.activeTargetIndex !== "all" && window.roomData[window.activeTargetIndex]) {
            const cam = document.querySelector('[gps-camera]');
            const target = window.roomData[window.activeTargetIndex].wrapper;
            
            if (cam && target) {
              const posCam = cam.object3D.position;
              const posTar = target.object3D.position;
              
              let dx = posTar.x - posCam.x;
              let dy = posTar.y - posCam.y;
              let dz = posTar.z - posCam.z;
              
              for (let i = 0; i < this.numDashes; i++) {
                let fraction = (i + 1) / (this.numDashes + 1); 
                let dashPos = {
                  x: posCam.x + (dx * fraction),
                  y: (posCam.y - 1.5) + (dy * fraction), 
                  z: posCam.z + (dz * fraction)
                };
                let dash = this.dashes[i];
                dash.setAttribute('position', dashPos);
                dash.object3D.lookAt(posTar.x, posTar.y, posTar.z);
                dash.setAttribute('visible', 'true');
              }
            }
          } else {
            for (let i = 0; i < this.numDashes; i++) {
              this.dashes[i].setAttribute('visible', 'false');
            }
          }
        }
      });
    </script>
  </head>
  
  <body style="margin: 0; overflow: hidden;">
    
    <!-- HEADER BARU -->
    <div id="app-header">
      <img src="logo.png" alt="Logo">
      <h1>AR Skanada</h1>
    </div>

    <!-- Peringatan Kamera -->
    <div id="error-overlay">
      <h2>Akses Kamera Ditolak! 📷</h2>
      <button onclick="window.location.reload()" style="padding: 10px 20px; font-size: 16px; margin-top: 15px;">Muat Ulang Halaman</button>
    </div>

    <!-- Pencarian -->
    <div id="search-container">
      <select id="room-search" onchange="filterRuangan(this.value)">
        <option value="all">📍 Tampilkan Semua Ruangan</option>
      </select>
    </div>

    <div id="hud-status">Sistem inisialisasi...</div>

    <!-- Pop Up Detail -->
    <div id="info-box">
      <h3 id="ruang-nama">Nama Ruangan</h3>
      <div id="ruang-jarak">Jarak: Menghitung...</div>
      <p id="ruang-info">Informasi detail ruangan</p>
      
      <div class="btn-container">
        <button id="route-btn">🗺️ Rute Jalan</button>
        <button id="close-btn" onclick="document.getElementById('info-box').style.display='none'; window.activePopupIndex = null;">Tutup</button>
      </div>
    </div>

    <!-- FOOTER BARU -->
    <div id="app-footer">
      created by Gde.A @skanada 2026
    </div>

    <!-- Scene AR -->
    <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Logo Sekolah Asset -->
      <a-assets>
        <img id="logo-smk" src="logo.png">
      </a-assets>

      <a-camera gps-camera rotation-reader>
        <a-entity cursor="rayOrigin: mouse;" raycaster="objects: .clickable"></a-entity>
      </a-camera>
      
      <!-- Garis jejak navigasi -->
      <a-entity id="garis-acuan" ar-garis-putus></a-entity>
    </a-scene>

    <script>
      window.addEventListener('camera-error', function () {
        document.getElementById('error-overlay').style.display = 'flex';
      });

      const apiUrl = 'https://script.google.com/macros/s/AKfycbzlLohSaDNKSYm7-lH6UXFp7uoPQ5gNWOZJiLz_RWZ4luKf06dwV_I3B5okhODXepEX/exec';

      let userLat = null;
      let userLng = null;
      
      window.roomData = {}; 
      window.activeTargetIndex = "all";
      window.activePopupIndex = null; 

      function hitungJarakMeter(lat1, lon1, lat2, lon2) {
        if (!lat1 || !lon1) return 0;
        const R = 6371e3; 
        const p1 = lat1 * Math.PI/180;
        const p2 = lat2 * Math.PI/180;
        const dp = (lat2-lat1) * Math.PI/180;
        const dl = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return Math.round(R * c);
      }

      function filterRuangan(indexDipilih) {
        window.activeTargetIndex = indexDipilih; 
        for (const key in window.roomData) {
          if (indexDipilih === "all") {
            window.roomData[key].wrapper.setAttribute('visible', 'true');
            window.roomData[key].border.setAttribute('color', '#00ff00');
          } else {
            if (key === indexDipilih) {
              window.roomData[key].wrapper.setAttribute('visible', 'true');
              window.roomData[key].border.setAttribute('color', '#ff0000');
            } else {
              window.roomData[key].wrapper.setAttribute('visible', 'false');
            }
          }
        }
      }

      function tampilkanInfoRuangan(index) {
        if (!window.roomData[index]) return;
        window.activePopupIndex = index;
        let data = window.roomData[index];
        
        document.getElementById('ruang-nama').innerText = data.nama;
        if (userLat && userLng) {
          let jarak = hitungJarakMeter(userLat, userLng, data.lat, data.lng);
          document.getElementById('ruang-jarak').innerText = "Jarak: " + jarak + " meter";
        } else {
          document.getElementById('ruang-jarak').innerText = "Jarak: Menunggu GPS...";
        }
        document.getElementById('ruang-info').innerText = data.info;
        
        document.getElementById('route-btn').onclick = function() {
          if (userLat && userLng) {
            const mapUrl = `https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLng}&destination=${data.lat},${data.lng}&travelmode=walking`;
            window.open(mapUrl, '_blank');
          } else {
            alert('Mohon tunggu sinyal GPS mengunci posisi Anda terlebih dahulu.');
          }
        };

        document.getElementById('info-box').style.display = 'block';
      }

      fetch(apiUrl, { redirect: 'follow' })
        .then(response => response.json())
        .then(locations => {
          
          const scene = document.querySelector('a-scene');
          const searchSelect = document.getElementById('room-search');
          
          locations.forEach((loc, index) => {
            const option = document.createElement('option');
            option.value = index;
            option.text = "🔍 Cari: " + loc.nama;
            searchSelect.appendChild(option);

            // 1. WRAPPER UTAMA (Mengatur Posisi GPS)
            const wrapper = document.createElement('a-entity');
            wrapper.setAttribute('gps-entity-place', `latitude: ${loc.lat}; longitude: ${loc.lng};`);

            // 2. KONTEN BILLBOARD (Selalu menghadap kamera & diperbesar)
            const billboard = document.createElement('a-entity');
            billboard.setAttribute('look-at', '[gps-camera]');
            billboard.setAttribute('scale', '5 5 5'); 

            // 3. BORDER LINGKARAN (Bingkai bulat di belakang logo)
            const border = document.createElement('a-circle');
            border.setAttribute('radius', '0.6');  // Radius 0.6 = Diameter 1.2
            border.setAttribute('color', '#00ff00'); 
            border.setAttribute('class', 'clickable'); 

            // 4. LOGO SEKOLAH (Gambar diubah bentuknya menjadi lingkaran juga)
            const logo = document.createElement('a-circle');
            logo.setAttribute('src', '#logo-smk');
            logo.setAttribute('radius', '0.5');    // Radius 0.5 = Diameter 1.0 (Lebih kecil dari border agar bingkai terlihat)
            logo.setAttribute('position', '0 0 0.05'); 
            
            // Susun elemen
            billboard.appendChild(border);
            billboard.appendChild(logo);
            wrapper.appendChild(billboard);

            // Simpan referensi data ruangan
            window.roomData[index] = {
              wrapper: wrapper,  
              border: border,    
              nama: loc.nama,
              lat: loc.lat,
              lng: loc.lng,
              info: loc.info
            };

            // Event saat border diklik
            border.addEventListener('click', function () {
              tampilkanInfoRuangan(index);
            });

            scene.appendChild(wrapper);
          });
          
        })
        .catch(error => console.error('Error fetching data:', error));

      // Pemanasan GPS
      if ('geolocation' in navigator) {
        document.getElementById('hud-status').innerText = "Memulai pemanasan GPS...";

        navigator.geolocation.getCurrentPosition(
          function(roughPosition) {
            document.getElementById('hud-status').innerText = "Satelit terpancing. Memuat presisi...";
            jalankanGPSPresisi();
          },
          function(error) {
            document.getElementById('hud-status').innerText = "Memaksa pencarian satelit...";
            jalankanGPSPresisi();
          },
          { enableHighAccuracy: false, maximumAge: 0, timeout: 5000 }
        );

        function jalankanGPSPresisi() {
          navigator.geolocation.watchPosition(
            function(position) {
              userLat = position.coords.latitude;
              userLng = position.coords.longitude;
              
              document.getElementById('hud-status').innerText = "GPS Aktif | Akurasi: " + Math.round(position.coords.accuracy) + "m";

              if (window.activePopupIndex !== null && window.roomData[window.activePopupIndex]) {
                 let data = window.roomData[window.activePopupIndex];
                 let jarak = hitungJarakMeter(userLat, userLng, data.lat, data.lng);
                 document.getElementById('ruang-jarak').innerText = "Jarak: " + jarak + " meter";
              }
            },
            function(error) {
              document.getElementById('hud-status').innerText = "Error GPS: Aktifkan lokasi";
              console.error('GPS Error:', error);
            },
            { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
          );
        }
      } else {
        document.getElementById('hud-status').innerText = "Perangkat tidak dukung GPS";
      }
    </script>
  </body>
</html>
