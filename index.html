<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>AR SMKN 1 Narmada</title>
    
    <!-- Library A-Frame dan AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    
    <style>
      /* --- UI PENCARIAN (BARU) --- */
      #search-container {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        z-index: 9999;
      }
      #room-search {
        width: 100%;
        padding: 12px 15px;
        font-size: 16px;
        border-radius: 8px;
        border: 2px solid #0055aa;
        background: rgba(255, 255, 255, 0.95);
        color: #333;
        font-weight: bold;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        outline: none;
      }

      /* Desain UI Pop-up Informasi */
      #info-box {
        position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
        background: rgba(0, 51, 102, 0.9); color: white; padding: 20px;
        border-radius: 12px; display: none; z-index: 9999; text-align: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; width: 85%; 
        box-shadow: 0px 4px 10px rgba(0,0,0,0.5);
      }
      #info-box h3 { margin-top: 0; color: #ffcc00; margin-bottom: 5px; }
      #ruang-jarak { font-weight: bold; color: #00ff00; margin-bottom: 15px; font-size: 1.1em; }
      #close-btn { padding: 8px 16px; background: #ff3333; color: white; border: none; border-radius: 5px; cursor: pointer; }
      
      /* Desain HUD Status GPS (Diturunkan sedikit agar tidak tertutup pencarian) */
      #hud-status {
        position: fixed; top: 75px; right: 5%; background: rgba(0,0,0,0.7);
        color: #00ff00; padding: 6px 10px; border-radius: 8px; z-index: 9999; 
        font-family: sans-serif; font-size: 11px; font-weight: bold;
      }
      
      /* Overlay Peringatan Kamera */
      #error-overlay {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9); color: white; display: none; 
        flex-direction: column; justify-content: center; align-items: center;
        z-index: 10000; font-family: sans-serif; text-align: center; padding: 20px;
      }
      #error-overlay h2 { color: #ff5555; }
    </style>
  </head>
  
  <body style="margin: 0; overflow: hidden;">
    
    <!-- UI Peringatan Kamera -->
    <div id="error-overlay">
      <h2>Akses Kamera Ditolak! 📷</h2>
      <p>Aplikasi AR membutuhkan akses kamera untuk menampilkan ruangan kelas.</p>
      <button onclick="window.location.reload()" style="padding: 10px 20px; font-size: 16px; margin-top: 15px;">Muat Ulang Halaman</button>
    </div>

    <!-- UI Pencarian Target Ruangan -->
    <div id="search-container">
      <select id="room-search" onchange="filterRuangan(this.value)">
        <option value="all">📍 Tampilkan Semua Ruangan</option>
        <!-- Daftar ruangan akan dimasukkan ke sini oleh Javascript -->
      </select>
    </div>

    <!-- UI HUD GPS -->
    <div id="hud-status">Sistem inisialisasi...</div>

    <!-- UI Pop-up Detail Ruangan -->
    <div id="info-box">
      <h3 id="ruang-nama">Nama Ruangan</h3>
      <div id="ruang-jarak">Jarak: Menghitung...</div>
      <p id="ruang-info">Informasi detail ruangan</p>
      <button id="close-btn" onclick="document.getElementById('info-box').style.display='none'">Tutup</button>
    </div>

    <!-- Scene Utama AR -->
    <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-camera gps-camera rotation-reader>
        <a-entity cursor="rayOrigin: mouse;" raycaster="objects: .clickable"></a-entity>
      </a-camera>
    </a-scene>

    <script>
      window.addEventListener('camera-error', function () {
        document.getElementById('error-overlay').style.display = 'flex';
      });

      const apiUrl = 'https://script.google.com/macros/s/AKfycbzlLohSaDNKSYm7-lH6UXFp7uoPQ5gNWOZJiLz_RWZ4luKf06dwV_I3B5okhODXepEX/exec';

      let userLat = null;
      let userLng = null;
      
      // Array untuk menyimpan data seluruh elemen 3D
      const roomData = {}; 

      function hitungJarakMeter(lat1, lon1, lat2, lon2) {
        if (!lat1 || !lon1) return 0;
        const R = 6371e3; 
        const p1 = lat1 * Math.PI/180;
        const p2 = lat2 * Math.PI/180;
        const dp = (lat2-lat1) * Math.PI/180;
        const dl = (lon2-lon1) * Math.PI/180;
        const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        return Math.round(R * c);
      }

      // FITUR BARU: Fungsi untuk memfilter ruangan berdasarkan Dropdown
      function filterRuangan(indexDipilih) {
        for (const key in roomData) {
          if (indexDipilih === "all") {
            // Tampilkan semua dan kembalikan warna ke hijau
            roomData[key].box.setAttribute('visible', 'true');
            roomData[key].box.setAttribute('color', '#00ff00');
          } else {
            if (key === indexDipilih) {
              // Jika ini ruangan yang dicari: Tampilkan dan ubah warna jadi Merah
              roomData[key].box.setAttribute('visible', 'true');
              roomData[key].box.setAttribute('color', '#ff0000');
            } else {
              // Sembunyikan ruangan lainnya
              roomData[key].box.setAttribute('visible', 'false');
            }
          }
        }
      }

      // Mengambil data dari Backend GAS
      fetch(apiUrl, { redirect: 'follow' })
        .then(response => response.json())
        .then(locations => {
          
          const scene = document.querySelector('a-scene');
          const searchSelect = document.getElementById('room-search');
          
          locations.forEach((loc, index) => {
            // Menambahkan Pilihan ke Dropdown Pencarian
            const option = document.createElement('option');
            option.value = index;
            option.text = "🔍 Cari: " + loc.nama;
            searchSelect.appendChild(option);

            // Membuat Objek Kotak AR
            const box = document.createElement('a-box');
            box.setAttribute('gps-entity-place', `latitude: ${loc.lat}; longitude: ${loc.lng};`);
            box.setAttribute('color', '#00ff00'); // Warna awal hijau
            box.setAttribute('scale', '25 25 25'); 
            box.setAttribute('class', 'clickable');

            // Membuat Objek Teks AR
            const text = document.createElement('a-text');
            text.setAttribute('value', loc.nama + '\n(...)');
            text.setAttribute('look-at', '[gps-camera]');
            text.setAttribute('align', 'center');
            text.setAttribute('position', '0 25 0'); 
            text.setAttribute('scale', '75 75 75'); 
            text.setAttribute('color', 'yellow');
            
            box.appendChild(text);

            // Simpan referensi BOX dan TEKS ke memori agar bisa diubah warnanya nanti
            roomData[index] = {
              box: box,
              teks: text,
              nama: loc.nama,
              lat: loc.lat,
              lng: loc.lng,
              info: loc.info
            };

            // Event saat kotak diklik
            box.addEventListener('click', function () {
              document.getElementById('ruang-nama').innerText = loc.nama;
              if (userLat && userLng) {
                let jarak = hitungJarakMeter(userLat, userLng, loc.lat, loc.lng);
                document.getElementById('ruang-jarak').innerText = "Jarak: " + jarak + " meter";
              } else {
                document.getElementById('ruang-jarak').innerText = "Jarak: Menunggu GPS...";
              }
              document.getElementById('ruang-info').innerText = loc.info;
              document.getElementById('info-box').style.display = 'block';
            });

            scene.appendChild(box);
          });
        })
        .catch(error => console.error('Error fetching data:', error));

      // --- STRATEGI PEMANASAN GPS ---
      if ('geolocation' in navigator) {
        document.getElementById('hud-status').innerText = "Memulai pemanasan GPS...";

        navigator.geolocation.getCurrentPosition(
          function(roughPosition) {
            document.getElementById('hud-status').innerText = "Satelit terpancing. Memuat presisi...";
            jalankanGPSPresisi();
          },
          function(error) {
            document.getElementById('hud-status').innerText = "Memaksa pencarian satelit...";
            jalankanGPSPresisi();
          },
          { enableHighAccuracy: false, maximumAge: 0, timeout: 5000 }
        );

        function jalankanGPSPresisi() {
          navigator.geolocation.watchPosition(
            function(position) {
              userLat = position.coords.latitude;
              userLng = position.coords.longitude;
              
              document.getElementById('hud-status').innerText = "GPS Aktif | Akurasi: " + Math.round(position.coords.accuracy) + "m";

              // Perbarui semua jarak pada teks 3D secara realtime
              for (const key in roomData) {
                 let data = roomData[key];
                 let jarak = hitungJarakMeter(userLat, userLng, data.lat, data.lng);
                 data.teks.setAttribute('value', data.nama + '\n(' + jarak + 'm)');
              }
            },
            function(error) {
              document.getElementById('hud-status').innerText = "Error GPS: Aktifkan lokasi";
              console.error('GPS Error:', error);
            },
            { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
          );
        }
      } else {
        document.getElementById('hud-status').innerText = "Perangkat tidak dukung GPS";
      }
    </script>
  </body>
</html>
